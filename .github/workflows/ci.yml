name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust unit tests
        run: cargo test --locked
      - name: Browser JS checks
        run: node tests/browser.test.cjs
      - name: Release pipeline guards
        run: python -B tests/release.test.py
      - name: Windows branding consistency
        run: |
          python -m pip install Pillow==12.2.0
          python scripts/generate-icons.py --check

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: Install Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $found = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $found -and -not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
      - name: Import code-signing certificate
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          if (-not $env:CODE_SIGNING_PFX) {
            Write-Host 'No signing certificate configured; building unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          $bytes = [Convert]::FromBase64String($env:CODE_SIGNING_PFX)
          [IO.File]::WriteAllBytes($pfx, $bytes)
          try {
            $importArgs = @{
              FilePath = $pfx
              CertStoreLocation = 'Cert:\CurrentUser\My'
            }
            if ($env:CODE_SIGNING_PASSWORD) {
              $importArgs.Password = ConvertTo-SecureString `
                $env:CODE_SIGNING_PASSWORD -AsPlainText -Force
            }
            $certificate = Import-PfxCertificate @importArgs |
              Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          } finally {
            Remove-Item -LiteralPath $pfx -Force
          }
          if (-not $certificate) {
            throw 'The code-signing PFX has no private-key certificate'
          }
          $line = "thumbprint=$($certificate.Thumbprint)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $line
      - name: Build, verify, and install-test the signed package
        if: steps.signing.outputs.thumbprint != ''
        env:
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: >-
          powershell -NoProfile -File scripts/package.ps1
          -CertificateThumbprint "$env:SIGNING_THUMBPRINT"
          -TimestampServer http://timestamp.digicert.com
      - name: Build, verify, and install-test the unsigned package
        if: steps.signing.outputs.thumbprint == ''
        run: powershell -NoProfile -File scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Veluno-Windows
          path: |
            target/release/veluno.exe
            target/release/veluno-setup.exe
            target/release/felaris.exe
            target/release/felaris-setup.exe
            target/release/SHA256SUMS
