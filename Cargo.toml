[package]
name = "veluno"
version = "0.3.5"
edition = "2024"

[dependencies]
wry = "0.57"
tao = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
adblock = "0.13.5"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_SystemInformation","Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39"

[build-dependencies]
embed-resource = "3.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
assigning_clones = "warn"
cast_possible_wrap = "warn"
format_collect = "warn"
large_stack_arrays = "warn"
undocumented_unsafe_blocks = "warn"
wildcard_imports = "warn"

[profile.dev]
debug = "line-tables-only"
