<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloads</title>
<style>
:root { color-scheme: dark; --bg:#101011; --surface-2:#1f1f25; --hover:rgb(255 255 255 / .08); --active:rgb(255 255 255 / .11); --line:rgb(255 255 255 / .09); --line-strong:rgb(255 255 255 / .16); --text:#f4f4f7; --muted:#a6a6b3; --accent:#dedee3; --p:0; font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif; font-size:13px; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
body { padding:12px; color:var(--text); user-select:none; }
button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; border-radius:8px; padding:0; }
button:hover { background:var(--hover); }
button:active:not(:disabled) { transform:scale(.97); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; pointer-events:none; }
[hidden] { display:none !important; }
.card { width:100%; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:12px; padding:10px 12px; box-shadow:inset 0 1px 0 rgb(255 255 255 / .06),0 10px 28px rgb(0 0 0 / .55); transform-origin:top left; transform:translateY(calc((1 - var(--p)) * -6px)) scale(calc(.97 + .03 * var(--p))); opacity:var(--p); }
.heading { display:flex; align-items:center; justify-content:space-between; }
.heading-actions { display:flex; align-items:center; gap:4px; }
.text-button { color:var(--muted); font-size:11px; font-weight:500; padding:2px 4px; white-space:nowrap; }
.text-button:hover { color:var(--text); }
.icon { width:26px; height:26px; display:grid; place-items:center; color:var(--muted); }
.icon:hover { color:var(--text); }
.summary { color:var(--muted); font-size:11.5px; margin:8px 0 0; font-variant-numeric:tabular-nums; }
.empty { color:var(--muted); font-size:12px; margin:10px 0 2px; }
.list { max-height:260px; overflow:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.download-item { padding:10px 0; border-top:1px solid var(--line); font-size:12px; overflow-wrap:anywhere; }
.download-item strong { display:block; font-weight:600; color:var(--text); }
.download-item strong[data-open] { cursor:pointer; }
.download-item small { display:block; color:var(--muted); margin:5px 0; font-variant-numeric:tabular-nums; }
.download-item progress { width:100%; height:4px; border:0; border-radius:2px; overflow:hidden; background:rgb(255 255 255 / .1); accent-color:var(--accent); }
.download-item progress::-webkit-progress-bar { background:rgb(255 255 255 / .1); border-radius:2px; }
.download-item progress::-webkit-progress-value { background:var(--accent); border-radius:2px; transition:width 200ms ease; }
.download-item button { padding:5px 10px; background:var(--active); border:1px solid var(--line); font-size:11.5px; font-weight:500; margin-top:6px; }
.download-item button:hover { background:rgb(255 255 255 / .16); border-color:var(--line-strong); }
.download-actions { display:flex; gap:6px; margin-top:6px; }
@media (prefers-reduced-motion:reduce) { .card { transform:none; } }
</style>
</head>
<body>
<section class="card" id="downloads" aria-label="Downloads">
<div class="heading"><strong>Downloads</strong><div class="heading-actions"><button class="text-button" id="reveal" hidden>Show folder</button><button class="text-button" id="clear" hidden>Clear</button><button class="icon" id="close" aria-label="Close downloads" title="Close"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div></div>
<p class="summary" id="summary" hidden></p>
<p class="empty" id="empty">No downloads yet.</p>
<div class="list" id="items"></div>
</section>
<script>__COMMON_SCRIPT__</script>
<script>
let currentItems = [];
const $ = id => document.getElementById(id);
const bytes = value => `${(Math.max(0, value) / (1024 * 1024)).toFixed(1)} MB`;
const card = $('downloads');
// Rust eases the reveal every frame and pushes it here, so the popup moves in step with the window.
window.setDownloadsProgress = value => document.documentElement.style.setProperty('--p', value);
// The native window is sized to the card, so report the card height after every list change and resize.
const reportSize = () => Veluno.send('downloads_size', { height: card.offsetHeight });
window.addEventListener('resize', reportSize);
const button = (label, onClick) => { const node = document.createElement('button'); node.textContent = label; node.onclick = onClick; return node; };
function renderItem(item) {
 const row = document.createElement('div');
 row.className = 'download-item';
 const name = document.createElement('strong');
 name.textContent = item.path.split(/[\\/]/).pop() || 'Download';
 name.title = item.path;
 const detail = document.createElement('small');
 const isComplete = item.status === 'complete' || (item.status === 'downloading' && item.total > 0 && item.received >= item.total);
 detail.textContent = isComplete ? `Complete · ${bytes(item.received)}`
  : item.status === 'cancelled' ? `Cancelled · ${bytes(item.received)} received`
  : item.status === 'interrupted' ? `Interrupted · ${bytes(item.received)} received`
  : `Downloading · ${bytes(item.received)}${item.total > 0 ? ` of ${bytes(item.total)} (${Math.min(100, Math.floor(item.received / item.total * 100))}%)` : ''}`;
 row.append(name, detail);
 if (item.status === 'downloading' && !isComplete) {
  const progress = document.createElement('progress');
  progress.setAttribute('aria-label', `Downloading ${name.textContent}`);
  if (item.total > 0) { progress.max = item.total; progress.value = item.received; }
  row.append(progress, button('Cancel', () => Veluno.send('cancel_download', { id: item.id })));
 }
 if (isComplete) {
  name.dataset.open = '';
  name.onclick = () => Veluno.send('open_download', { id: item.id });
  const actions = document.createElement('div');
  actions.className = 'download-actions';
  actions.append(button('Open', () => Veluno.send('open_download', { id: item.id })), button('Show in folder', () => Veluno.send('reveal_download', { id: item.id })));
  row.append(actions);
 }
 return row;
}
window.updateDownloads = state => {
 currentItems = state.items || [];
 $('empty').hidden = currentItems.length > 0;
 const summary = Veluno.downloadSummary(currentItems);
 $('summary').textContent = summary.label;
 $('summary').hidden = !summary.label;
 $('reveal').hidden = summary.newest == null;
 $('clear').hidden = !currentItems.some(item => item.status !== 'downloading');
 $('items').replaceChildren(...currentItems.slice().reverse().map(renderItem));
 reportSize();
};
$('close').onclick = () => Veluno.send('close_downloads');
$('clear').onclick = () => Veluno.send('clear_downloads');
$('reveal').onclick = () => { const newest = Veluno.downloadSummary(currentItems).newest; if (newest != null) Veluno.send('reveal_download', { id: newest }); };
document.addEventListener('keydown', event => { if (event.key === 'Escape') Veluno.send('close_downloads'); });
</script>
</body>
</html>
