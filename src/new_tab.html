<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veluno — New tab search</title>
<style>
/* A dark root color-scheme makes the WebView canvas opaque; scope it to the panel. */
:root { color-scheme:normal; font-family:"Segoe UI",system-ui,sans-serif; color:#f8f8fa; --muted:#c8c8d2; --line:#3f3f49; --focus:#dedee3; }
* { box-sizing:border-box; }
html { background:transparent; }
body { margin:0; height:100vh; background:transparent; padding:clamp(40px,18vh,160px) 24px 24px; display:flex; align-items:flex-start; justify-content:center; overflow:hidden; }
.scrim { position:fixed; inset:0; background:rgb(0 0 0 / .56); pointer-events:none; }
.palette { position:relative; color-scheme:dark; width:min(640px,100%); max-height:100%; display:flex; flex-direction:column; background:#1c1c21; border:1px solid #484854; border-radius:14px; box-shadow:inset 0 1px 0 rgb(255 255 255 / .08),0 28px 84px rgb(0 0 0 / .65); overflow:hidden; }
form { display:flex; align-items:center; gap:14px; padding:14px 16px; background:#232329; border-bottom:1px solid var(--line); flex-shrink:0; }
svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; color:var(--muted); }
input,button { font:inherit; } input { min-width:0; width:100%; border:0; background:transparent; color:#f8f8fa; caret-color:var(--focus); font-size:17px; font-weight:500; height:36px; outline:none; }
input::placeholder { color:var(--muted); opacity:1; } ::selection { color:white; background:#45454b; }
form:focus-within { border-bottom-color:var(--focus); }
.close { width:30px; height:30px; display:grid; place-items:center; border:0; border-radius:7px; background:none; color:var(--muted); cursor:pointer; flex-shrink:0; } .close svg { width:16px; height:16px; } .close:hover { background:#34343e; color:white; } .close:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
.results { padding:6px; overflow:auto; min-height:0; scrollbar-width:thin; scrollbar-color:#45454b transparent; }
.option { display:flex; align-items:center; gap:12px; padding:10px 12px; min-height:60px; border-radius:8px; cursor:pointer; }
.option[aria-selected="true"] { background:#32323b; box-shadow:inset 0 1px 0 rgb(255 255 255 / .08); }
.option-icon { width:18px; height:18px; flex-shrink:0; display:grid; place-items:center; } .option-icon svg,.option-icon img { grid-area:1/1; width:18px; height:18px; } .option-icon img { object-fit:contain; } .option-text { min-width:0; flex:1; } .option-title,.option-detail { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .option-title { font-size:14px; font-weight:500; line-height:1.5; color:#f8f8fa; } .option-detail { color:var(--muted); font-size:12px; line-height:1.5; }
.empty { margin:0; padding:18px 16px 22px; font-size:13px; color:var(--muted); line-height:1.6; }
footer { border-top:1px solid var(--line); background:#18181c; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:11px 18px; font-size:12px; color:var(--muted); flex-shrink:0; }
kbd { font:500 11px "Segoe UI",system-ui,sans-serif; color:#f8f8fa; background:#232329; border:1px solid #484854; padding:1px 6px; border-radius:4px; margin-right:5px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
[hidden] { display:none!important; }
@media(max-width:500px) { body { padding:40px 12px 12px; } form { padding:12px; gap:10px; } input { font-size:15px; } }
.close,.option { transition:background-color 160ms cubic-bezier(.2,0,0,1),color 160ms cubic-bezier(.2,0,0,1),transform 180ms cubic-bezier(.16,1,.3,1); }
.close:active { transform:scale(.96); transition-duration:70ms; }
@media(prefers-reduced-motion:reduce) { .close,.option { transition-duration:80ms; } .close:active { transform:none; } }
</style>
</head>
<body>
<div class="scrim" aria-hidden="true"></div>
<section class="palette" role="dialog" aria-modal="true" aria-label="Open a new tab">
<form id="new-tab-form" role="search">
<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg>
<label for="new-tab-input" class="sr-only">Search the web or enter address</label>
<input id="new-tab-input" placeholder="Search the web or enter address" role="combobox" aria-autocomplete="list" aria-controls="new-tab-results" aria-expanded="false" autocomplete="off" spellcheck="false">
<button class="close" type="button" id="dismiss" title="Cancel (Escape)" aria-label="Cancel new tab"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
</form>
<div class="results" id="new-tab-results" role="listbox" aria-label="Search or switch to an open tab"></div>
<p class="empty" id="empty">Search the web or enter a URL. Your current page stays open.</p>
<div class="sr-only" role="status" id="result-status" aria-live="polite"></div>
<footer><span><kbd>Enter</kbd>Open <span aria-hidden="true"> · </span><kbd>↑ ↓</kbd>Choose</span><span><kbd>Esc</kbd>Cancel</span></footer>
</section>
<script>__COMMON_SCRIPT__</script>
<script>
const input=document.getElementById('new-tab-input');
const results=document.getElementById('new-tab-results');
let state={tabs:[],workspaces:[],shortcuts:[]};
let historyEntries=[];
let options=[];
let selected=0;
let submitting=false;
let composing=false;
const panel=document.querySelector('.palette');
const scrim=document.querySelector('.scrim');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches)document.getAnimations().forEach(animation=>animation.finish());});
function finish(action,payload={}) {
 if(submitting) return;
 submitting=true;
 input.readOnly=true;
 const style=getComputedStyle(panel);
 const from={opacity:style.opacity,transform:style.transform};
 const scrimOpacity=getComputedStyle(scrim).opacity;
 document.getAnimations().forEach(animation=>animation.cancel());
 if(reducedMotion.matches) {Veluno.send(action,payload);return;}
 scrim.animate([{opacity:scrimOpacity},{opacity:0}],{duration:100,fill:'forwards',id:'palette-scrim'});
 const exit=panel.animate([from,{opacity:0,transform:'translateY(-6px) scale(.99)'}],{duration:100,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards',id:'palette-close'});
 exit.finished.then(()=>Veluno.send(action,payload)).catch(()=>{});
}
const dismiss=()=>finish('dismiss_new_tab');
function select(index,scroll=true) {
 selected=index;
 for(const [i,row] of [...results.children].entries()) row.setAttribute('aria-selected',String(i===selected));
 const row=results.children[selected];
 if(row) { input.setAttribute('aria-activedescendant',row.id); if(scroll) row.scrollIntoView({block:'nearest'}); }
 else input.removeAttribute('aria-activedescendant');
}
function render() {
 options=Veluno.suggestions(input.value,state,historyEntries);
 results.replaceChildren();
 options.forEach((option,index)=>{
  const row=document.createElement('div'); row.id='new-tab-option-'+index; row.className='option'; row.setAttribute('role','option');
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('aria-hidden','true');
  const path=document.createElementNS(svg.namespaceURI,'path');
  path.setAttribute('d',option.search?'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm5 12 6 6':option.id?'M4 5h16v14H4zM4 9h16':option.history?'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4v5l3 2':option.bookmark?'m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9z':'M5 12h14m-6-6 6 6-6 6');
  svg.append(path);
  const icon=document.createElement('span'); icon.className='option-icon'; icon.setAttribute('aria-hidden','true'); icon.append(svg);
  if(!option.search) {
   try {
    const site=new URL(option.url);
    if(['https:','http:'].includes(site.protocol)) {
     const root=site.origin+'/favicon.ico';
     const known=[option,...(state.tabs||[]),...(state.shortcuts||[]),...(historyEntries||[])].find(item=>{
      try { return item.favicon&&new URL(item.url).hostname===site.hostname&&['https:','http:'].includes(new URL(item.favicon).protocol); } catch { return false; }
     });
     const img=document.createElement('img'); img.alt=''; img.referrerPolicy='no-referrer'; img.hidden=true;
     img.onload=()=>{img.hidden=false;svg.style.visibility='hidden';};
     img.onerror=()=>{ img.hidden=true; svg.style.visibility=''; if(img.src!==root) img.src=root; else img.remove(); };
     img.src=known?.favicon||root; icon.append(img);
    }
   } catch {}
  }
  const text=document.createElement('span'); text.className='option-text';
  const title=document.createElement('span'); title.className='option-title'; title.textContent=option.title;
  const detail=document.createElement('span'); detail.className='option-detail'; detail.textContent=option.detail;
  text.append(title,detail); row.append(icon,text);
  row.onpointermove=()=>{if(!submitting&&selected!==index)select(index,false);};
  row.onmousedown=event=>event.preventDefault(); row.onclick=()=>{select(index);submit();};
  results.append(row);
 });
 input.setAttribute('aria-expanded',String(options.length>0));
 document.getElementById('empty').hidden=options.length>0;
 document.getElementById('result-status').textContent=options.length?`${options.length} ${options.length===1?'suggestion':'suggestions'} available`:'';
 select(0);
}
function submit() {
 if(submitting||composing) return;
 const option=options[selected];
 if(!option) return;
 finish(option.id?'switch_tab':'submit_new_tab',option.id?{id:option.id}:{url:option.url});
}
window.openNewTab=(browserState,recentHistory=browserState?.history||historyEntries)=>{
 const interrupted=panel.getAnimations().some(animation=>animation.id.startsWith('palette-')&&animation.playState!=='finished');
 const from=interrupted?{opacity:getComputedStyle(panel).opacity,transform:getComputedStyle(panel).transform}:{opacity:.6,transform:'translateY(-12px) scale(.985)'};
 const scrimOpacity=interrupted?getComputedStyle(scrim).opacity:0;
 document.getAnimations().forEach(animation=>animation.cancel());
 state=browserState||{tabs:[],workspaces:[],shortcuts:[]};
 historyEntries=Array.isArray(recentHistory)?recentHistory:[];
 input.value=''; input.readOnly=false; submitting=false; composing=false; render(); input.focus();
 if(!reducedMotion.matches) {
  scrim.animate([{opacity:scrimOpacity},{opacity:1}],{duration:220,easing:'cubic-bezier(.2,0,0,1)',id:'palette-scrim'});
  panel.animate([from,{opacity:1,transform:'translateY(0) scale(1)'}],{duration:280,easing:'cubic-bezier(.16,1,.3,1)',id:'palette-open'});
 }
};
input.addEventListener('compositionstart',()=>{composing=true;});
input.addEventListener('compositionend',()=>{composing=false;});
input.oninput=()=>{if(!submitting)render();};
document.getElementById('new-tab-form').onsubmit=event=>{event.preventDefault();submit();};
document.getElementById('dismiss').onclick=dismiss;
document.body.onmousedown=event=>{if(event.target===document.body)dismiss();};
window.addEventListener('keydown',event=>{
 if(event.isComposing) return;
 if(event.key==='Escape'||(event.ctrlKey&&event.key.toLowerCase()==='w')) {event.preventDefault();dismiss();}
 else if(event.ctrlKey&&['t','l'].includes(event.key.toLowerCase())) {event.preventDefault();if(submitting)window.openNewTab(state);input.focus();input.select();}
 else if(['ArrowDown','ArrowUp'].includes(event.key)&&options.length) {event.preventDefault();select((selected+(event.key==='ArrowDown'?1:-1)+options.length)%options.length);input.focus();}
 else if(event.key==='Tab') {event.preventDefault();(document.activeElement===input?document.getElementById('dismiss'):input).focus();}
});
</script>
</body>
</html>
